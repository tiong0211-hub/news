name: Daily Investment News Briefing

on:
  # GitHub Actions의 schedule 트리거는 혼잡 시 몇 시간씩 지연될 수 있어 사용하지 않는다.
  # 대신 외부 크론 서비스(cron-job.org 등)가 매일 정해진 시각에 이 workflow_dispatch를
  # (inputs 없이) 호출해서 실행한다. 주말/공휴일 건너뛰기는 src/build.py가 항상 수행하며,
  # 테스트 목적으로 건너뛰기를 무시하고 강제 실행하려면 force 입력을 true로 주고 수동 실행한다.
  workflow_dispatch:
    inputs:
      force:
        description: "주말/공휴일이어도 강제로 실행 (테스트용)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, summarize and build newsletter page
        id: build
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          NAVER_QUERIES: ${{ vars.NAVER_QUERIES }}
          DOMESTIC_SOURCE_DOMAINS: ${{ vars.DOMESTIC_SOURCE_DOMAINS }}
          FOREIGN_SOURCE_DOMAINS: ${{ vars.FOREIGN_SOURCE_DOMAINS }}
          TOP_N: ${{ vars.TOP_N }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python -m src.build

      - name: Commit newsletter archive
        if: steps.build.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update daily newsletter archive ($(date -u +%F))"
          git push

      - name: Configure Pages
        if: steps.build.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload newsletter artifact
        if: steps.build.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # GitHub의 artifact 저장소가 방금 올라간 파일을 바로 못 찾아 deploy-pages가
      # "No artifacts found"로 실패하는 경우가 가끔 있다(GitHub 쪽 전파 지연). 짧게
      # 대기해 그 지연을 흡수한다.
      - name: Wait for artifact to become available
        if: steps.build.outputs.skip != 'true'
        run: sleep 15

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Kakao link message
        if: steps.build.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m src.send_kakao

      - name: Send email briefing (optional)
        if: steps.build.outputs.skip != 'true'
        env:
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: python -m src.send_email
