name: Daily Investment News Briefing

on:
  schedule:
    # 매일 07:30 KST (UTC 22:30 전날)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, summarize and build newsletter page
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          NAVER_QUERIES: ${{ vars.NAVER_QUERIES }}
          DOMESTIC_SOURCE_DOMAINS: ${{ vars.DOMESTIC_SOURCE_DOMAINS }}
          FOREIGN_SOURCE_DOMAINS: ${{ vars.FOREIGN_SOURCE_DOMAINS }}
          TOP_N: ${{ vars.TOP_N }}
        run: python -m src.build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload newsletter artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Kakao link message
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m src.send_kakao
