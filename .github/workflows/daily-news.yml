name: Daily Investment News Briefing

on:
  schedule:
    # 매일 08:00 KST, 월~금만 (UTC 기준 일~목 23:00). 한국 공휴일은 src/build.py에서 건너뜀.
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, summarize and build newsletter page
        id: build
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          NAVER_QUERIES: ${{ vars.NAVER_QUERIES }}
          DOMESTIC_SOURCE_DOMAINS: ${{ vars.DOMESTIC_SOURCE_DOMAINS }}
          FOREIGN_SOURCE_DOMAINS: ${{ vars.FOREIGN_SOURCE_DOMAINS }}
          TOP_N: ${{ vars.TOP_N }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python -m src.build

      - name: Commit newsletter archive
        if: steps.build.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update daily newsletter archive ($(date -u +%F))"
          git push

      - name: Configure Pages
        if: steps.build.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload newsletter artifact
        if: steps.build.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Kakao link message
        if: steps.build.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m src.send_kakao

      - name: Send email briefing (optional)
        if: steps.build.outputs.skip != 'true'
        env:
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: python -m src.send_email
