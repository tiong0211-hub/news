name: Kakao Token Exchange (one-time setup)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "카카오 로그인 후 리다이렉트된 URL의 code= 값"
        required: true

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Exchange authorization code for tokens
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: "https://example.com/oauth"
          AUTH_CODE: ${{ inputs.code }}
        run: |
          python - <<'EOF'
          import os
          import requests

          data = {
              "grant_type": "authorization_code",
              "client_id": os.environ["KAKAO_REST_API_KEY"].strip(),
              "redirect_uri": os.environ["KAKAO_REDIRECT_URI"].strip(),
              "code": os.environ["AUTH_CODE"].strip(),
          }
          client_secret = os.environ.get("KAKAO_CLIENT_SECRET", "").strip()
          if client_secret:
              data["client_secret"] = client_secret

          resp = requests.post(
              "https://kauth.kakao.com/oauth/token",
              headers={"Content-Type": "application/x-www-form-urlencoded;charset=utf-8"},
              data=data,
              timeout=15,
          )
          print(resp.status_code)
          print(resp.text)
          EOF
